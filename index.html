<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>一句话记账</title>
<meta name="theme-color" content="#F1F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1312" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="记账">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* 布局：一本随身账簿。顶部是本月合计（会计双下划线），下面一句话记账，再往下是按天分组的流水。 */
:root {
  --bg: #F1F4F2;          /* 带一点玉色的灰底 */
  --surface: #FFFFFF;
  --sunken: #E8EDEA;
  --ink: #14201D;
  --muted: #5F6E69;
  --faint: #8A9893;
  --line: #DCE3E0;
  --jade: #0B6B5F;        /* 主色：玉绿 */
  --jade-ink: #FFFFFF;
  --jade-soft: #D8EEE8;
  --income: #1E7F4E;
  --danger: #B42318;
  --toast-bg: #14201D;
  --toast-fg: #F1F4F2;
  --shadow: 0 1px 0 rgba(20, 32, 29, .04), 0 6px 20px -8px rgba(20, 32, 29, .12);

  --f-num: "Space Grotesk", "SF Pro Display", -apple-system, "Helvetica Neue", sans-serif;
  --f-text: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;

  --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
  --tab-h: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1312; --surface: #151D1B; --sunken: #1C2624; --ink: #E4EBE8; --muted: #9AA8A3; --faint: #6E7C77;
    --line: #24302D; --jade: #45C2AD; --jade-ink: #06201B; --jade-soft: #173A34; --income: #5BC98E; --danger: #F2877C;
    --toast-bg: #E4EBE8; --toast-fg: #0D1312; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1312; --surface: #151D1B; --sunken: #1C2624; --ink: #E4EBE8; --muted: #9AA8A3; --faint: #6E7C77;
  --line: #24302D; --jade: #45C2AD; --jade-ink: #06201B; --jade-soft: #173A34; --income: #5BC98E; --danger: #F2877C;
  --toast-bg: #E4EBE8; --toast-fg: #0D1312; --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.5 var(--f-text); -webkit-font-smoothing: antialiased;
  padding-bottom: calc(var(--tab-h) + 24px + env(safe-area-inset-bottom, 0px)); }
main { max-width: 560px; margin: 0 auto;
  padding-top: calc(8px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
section[id^="page-"] { display: flex; flex-direction: column; gap: 14px; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--sunken); border: 1px solid transparent;
  border-radius: var(--r-sm); padding: 9px 11px; width: 100%; min-width: 0; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--jade); background: var(--surface); }
.hidden { display: none !important; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.muted { color: var(--muted); }
.hint { font-size: 12.5px; color: var(--muted); }
.row { display: flex; align-items: center; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.inc { color: var(--income); }

/* 区块标题 */
.section-h { display: flex; align-items: baseline; justify-content: space-between; margin-top: 10px; padding: 0 2px; }
h2 { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .08em; margin: 0; }
.link { color: var(--jade); font-size: 14px; font-weight: 600; }

.panel { background: var(--surface); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--shadow); }

/* 按钮 */
.btn { background: var(--jade); color: var(--jade-ink); border-radius: var(--r-md); padding: 12px 16px; font-weight: 600; font-size: 15px; }
.btn.ghost { background: var(--sunken); color: var(--ink); }
.btn.danger { background: transparent; color: var(--danger); }
.btn:active { transform: scale(.98); }

/* ---------- 顶部合计 ---------- */
.ledger-head { padding: 14px 4px 4px; display: grid; gap: 6px; }
.ledger-head .eyebrow { font-size: 13px; color: var(--muted); }
.ledger-head .total { font-family: var(--f-num); font-weight: 600; font-size: 44px; line-height: 1.05; letter-spacing: -.03em;
  font-variant-numeric: tabular-nums; justify-self: start;
  /* 会计里“合计”的双下划线 */
  padding-bottom: 6px; border-bottom: 4px double var(--ink); }
.ledger-head .total .cur { font-size: 22px; font-weight: 500; color: var(--muted); margin-right: 4px; letter-spacing: 0; }
.ledger-head .alt { font-size: 14px; color: var(--muted); font-weight: 500; }
.ledger-head .meta { display: flex; gap: 18px; margin-top: 6px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.ledger-head .meta b { font-family: var(--f-num); font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; margin-left: 4px; }
.ledger-head .meta b.inc { color: var(--income); }

/* ---------- 一句话输入 ---------- */
.composer { display: grid; gap: 10px; }
.say { display: flex; align-items: flex-end; gap: 10px; background: var(--surface); border-radius: 22px; padding: 10px 10px 10px 16px;
  box-shadow: var(--shadow); border: 1.5px solid transparent; transition: border-color .15s; }
.say:focus-within { border-color: var(--jade); }
.say textarea { background: transparent; border: 0; padding: 8px 0; font-size: 17px; line-height: 1.45; resize: none; min-height: 56px; }
.say textarea:focus { background: transparent; }
.say textarea::placeholder { color: var(--faint); }
.mic { width: 56px; height: 56px; border-radius: 18px; background: var(--jade); color: var(--jade-ink); display: grid; place-items: center; flex: none;
  transition: background .2s, border-radius .2s; }
.mic svg { width: 26px; height: 26px; }
.mic.on { background: var(--danger); color: #fff; border-radius: 50%; animation: pulse 1.3s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--danger) 45%, transparent); } 100% { box-shadow: 0 0 0 16px transparent; } }
.composer .hint { padding: 0 4px; }
.examples { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.examples::-webkit-scrollbar { display: none; }
.examples button { flex: none; font-size: 13px; background: transparent; border: 1px dashed var(--line); color: var(--muted); border-radius: 999px; padding: 5px 12px; }

/* ---------- 分类字标 ---------- */
.glyph { --c: #6B7672; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none;
  font-size: 16px; font-weight: 600; color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--surface)); }
.glyph.sm { width: 22px; height: 22px; border-radius: 7px; font-size: 12px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .glyph { color: color-mix(in srgb, var(--c) 60%, white); background: color-mix(in srgb, var(--c) 24%, var(--surface)); } }
:root[data-theme="dark"] .glyph { color: color-mix(in srgb, var(--c) 60%, white); background: color-mix(in srgb, var(--c) 24%, var(--surface)); }

/* ---------- 识别结果卡片 ---------- */
#drafts { display: grid; gap: 10px; }
#drafts:empty { display: none; }
.draft { background: var(--surface); border-radius: var(--r-lg); padding: 14px 16px 16px; box-shadow: var(--shadow); display: grid; gap: 12px;
  border-top: 3px solid var(--jade); animation: rise .2s ease-out; }
@keyframes rise { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } }
.draft-top { display: flex; align-items: center; gap: 10px; }
.heard { font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg { display: inline-flex; background: var(--sunken); border-radius: 10px; padding: 3px; flex: none; }
.seg button { padding: 4px 12px; border-radius: 8px; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.amt-row { display: flex; align-items: baseline; gap: 8px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.amt-row select { width: auto; background: transparent; padding: 4px 2px; font-family: var(--f-num); font-weight: 600; color: var(--muted); font-size: 15px; }
.amt { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 34px; font-weight: 600; letter-spacing: -.02em;
  background: transparent !important; border: 0 !important; padding: 0; line-height: 1.2; }
.amt.inc { color: var(--income); }
.amt::placeholder { color: var(--danger); font-size: 15px; font-weight: 500; font-family: var(--f-text); letter-spacing: 0; }
.cats { display: flex; gap: 6px; margin: 0 -16px; padding: 0 16px; overflow-x: auto; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cat { --c: #6B7672; flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px 4px 4px; border-radius: 999px;
  background: var(--sunken); font-size: 13px; color: var(--ink); border: 1.5px solid transparent; }
.cat.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 10%, var(--surface)); font-weight: 600; }
.fields { display: grid; grid-template-columns: 1fr 1.3fr; gap: 8px; }
.fields select, .fields input { font-size: 14px; }
.actions { display: flex; gap: 8px; }
.actions .btn { flex: 1; }
.actions .btn.small { flex: 0 0 auto; padding: 8px 12px; font-size: 13px; }

/* ---------- 流水 ---------- */
.list { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 4px 16px; }
.day + .day { border-top: 1px solid var(--line); }
.day-h { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding: 12px 0 2px; }
.day-h .num { font-size: 12.5px; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 0; cursor: pointer; }
.item .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .m { text-align: right; font-family: var(--f-num); font-weight: 600; font-size: 16px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.item .m small { display: block; font-weight: 500; font-size: 11.5px; color: var(--faint); }
.empty { text-align: center; color: var(--muted); padding: 32px 8px; font-size: 14px; line-height: 1.7; }
.empty b { color: var(--ink); font-weight: 600; }

/* ---------- 统计 ---------- */
.month-nav { display: flex; align-items: center; justify-content: space-between; padding: 10px 0 0; }
.month-nav b { font-family: var(--f-num); font-size: 20px; font-weight: 600; }
.month-nav button { width: 40px; height: 40px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; }
.month-nav button svg { width: 18px; height: 18px; }
.kpis { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: 0; }
.kpis > div { padding: 2px 12px; }
.kpis > div + div { border-left: 1px solid var(--line); }
.kpis > div:first-child { padding-left: 0; }
.kpis .k { font-size: 12px; color: var(--muted); }
.kpis .v { font-family: var(--f-num); font-weight: 600; font-size: clamp(15px, 4.4vw, 19px); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chart { display: grid; gap: 6px; }
.daily { position: relative; display: flex; align-items: flex-end; gap: 3px; height: 96px;
  background: repeating-linear-gradient(to top, var(--line) 0 1px, transparent 1px 32px); border-bottom: 1px solid var(--line); }
.daily i { flex: 1; background: var(--jade); opacity: .45; border-radius: 3px 3px 0 0; min-height: 0; }
.daily i.today { opacity: 1; }
.axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); }
.bar-row { display: grid; grid-template-columns: minmax(0, 7.5em) 1fr auto; gap: 10px; align-items: center; padding: 7px 0; font-size: 14px; }
.bar-row .lbl { display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 8px; background: var(--sunken); border-radius: 6px; overflow: hidden; }
.bar > i { --c: var(--jade); display: block; height: 100%; background: var(--c); border-radius: 6px; }
.bar-row .val { font-family: var(--f-num); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.bar-row .val small { font-weight: 500; color: var(--faint); margin-left: 4px; font-size: 11.5px; }

/* ---------- 设置 ---------- */
.set-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
.set-row + .set-row { border-top: 1px solid var(--line); }
.acc-row { display: grid; grid-template-columns: 1fr 84px 36px; gap: 6px; padding: 10px 0; }
.acc-row + .acc-row { border-top: 1px solid var(--line); }
.acc-row input.kw { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); }
.acc-row button { border-radius: var(--r-sm); color: var(--faint); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.rate-input { width: 96px; display: inline-block; font-family: var(--f-num); }
pre.vlog { margin: 0; font: 12px/1.6 ui-monospace, Menlo, monospace; white-space: pre-wrap; max-height: 220px; overflow: auto; color: var(--muted); }

/* ---------- 底部导航 ---------- */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex;
  background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
nav.tabs button { flex: 1; height: var(--tab-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 11px; color: var(--faint); }
nav.tabs svg { width: 24px; height: 24px; }
nav.tabs button.on { color: var(--jade); font-weight: 600; }

/* ---------- 弹层 / 提示 ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(8, 14, 12, .45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; border-radius: 22px 22px 0 0; max-height: 90vh; overflow: auto;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet::before { content: ""; display: block; width: 38px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 10px; }
.sheet-title { display: grid; gap: 2px; margin-bottom: 10px; }
.sheet-title b { font-size: 17px; }
.toast { position: fixed; left: 50%; bottom: calc(var(--tab-h) + 26px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--toast-bg); color: var(--toast-fg); padding: 11px 16px; border-radius: 14px; font-size: 14px; z-index: 30;
  display: flex; gap: 16px; align-items: center; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.toast span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toast button { color: var(--jade-soft); font-weight: 700; white-space: nowrap; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .toast button { color: var(--jade-ink); } }
:root[data-theme="dark"] .toast button { color: var(--jade-ink); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <!-- 记账 -->
  <section id="page-home">
    <header class="ledger-head">
      <div class="eyebrow" id="sum-label">本月支出</div>
      <div class="total" id="sum-total"></div>
      <div class="alt num" id="sum-alt"></div>
      <div class="meta" id="sum-meta"></div>
    </header>

    <div class="composer">
      <div class="say">
        <textarea id="input" rows="2" class="grow" placeholder="说一句，比如：午饭麦当劳 12 块 5，PayNow"></textarea>
        <button class="mic" id="mic" aria-label="语音记账">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11.5" rx="3"/><path d="M5.5 10.5a6.5 6.5 0 0 0 13 0M12 17v4.5"/></svg>
        </button>
      </div>
      <div class="hint" id="mic-hint">点麦克风说一句，金额、分类、付款方式和日期会自动填好。一次说几笔也行。</div>
      <div class="examples" id="examples"></div>
    </div>

    <div id="drafts"></div>

    <div class="section-h"><h2>最近</h2><button class="link" id="manual">手动记一笔</button></div>
    <div class="list" id="recent"></div>
  </section>

  <!-- 统计 -->
  <section id="page-stats" class="hidden">
    <div class="month-nav">
      <button id="m-prev" aria-label="上个月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <b id="m-label"></b>
      <button id="m-next" aria-label="下个月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="panel kpis" id="m-summary"></div>
    <div class="section-h"><h2>每日支出</h2><span class="hint" id="m-peak"></span></div>
    <div class="panel chart"><div class="daily" id="m-daily"></div><div class="axis" id="m-axis"></div></div>
    <div class="section-h"><h2>花在哪</h2></div>
    <div class="panel" id="m-cats"></div>
    <div class="section-h"><h2>用什么付</h2></div>
    <div class="panel" id="m-accs"></div>
    <div class="section-h"><h2>本月明细</h2></div>
    <div class="list" id="m-list"></div>
  </section>

  <!-- 设置 -->
  <section id="page-settings" class="hidden">
    <div class="section-h"><h2>币种和汇率</h2></div>
    <div class="panel">
      <div class="set-row"><span class="grow">统计用的主币种</span><select id="s-base" style="width:auto"></select></div>
      <div class="set-row"><span class="grow">1 SGD = <input id="s-cny" class="rate-input" type="number" step="0.0001" inputmode="decimal"> CNY</span>
        <button class="btn ghost" id="s-rate" style="padding:8px 12px;font-size:13px">联网更新</button></div>
      <div class="hint" id="s-rate-info"></div>
    </div>

    <div class="section-h"><h2>付款方式</h2><span class="hint">说到关键词就自动选中</span></div>
    <div class="panel">
      <div id="s-accs"></div>
      <div class="set-row"><span class="grow">没说付款方式时用</span><select id="s-default" style="width:auto"></select></div>
      <button class="btn ghost" id="s-add-acc" style="width:100%;margin-top:8px">添加付款方式</button>
    </div>

    <div class="section-h"><h2>我教过的分类</h2></div>
    <div class="panel" id="s-learned"></div>

    <div class="section-h"><h2>语音诊断</h2><span class="hint">麦克风不好用时截图这里</span></div>
    <div class="panel">
      <pre class="vlog" id="s-vlog"></pre>
      <button class="btn ghost" id="s-vlog-clear" style="margin-top:10px;padding:8px 12px;font-size:13px">清空记录</button>
    </div>

    <div class="section-h"><h2>数据</h2></div>
    <div class="panel" style="display:grid;gap:12px">
      <div class="hint">记录只存在这台手机的浏览器里，建议每月导出一次备份。</div>
      <div class="btn-row">
        <button class="btn ghost" id="s-export">导出备份</button>
        <button class="btn ghost" id="s-csv">导出表格</button>
        <button class="btn ghost" id="s-import">导入备份</button>
        <input type="file" id="s-file" accept=".json,application/json" class="hidden">
      </div>
      <div class="hint" id="s-count"></div>
    </div>
  </section>
