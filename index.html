<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>一句话记账</title>
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="记账">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --text: #111827; --sub: #6b7280; --line: #e5e7eb;
  --brand: #0f766e; --brand-soft: #ccfbf1; --red: #dc2626; --green: #16a34a; --chip: #f3f4f6;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0b0f14; --card: #151b23; --text: #e5e7eb; --sub: #9ca3af; --line: #263040;
    --brand: #2dd4bf; --brand-soft: #134e4a; --red: #f87171; --green: #4ade80; --chip: #1f2833;
    --shadow: none; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; }
body { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
main { max-width: 560px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) 16px 16px; }
h2 { font-size: 13px; color: var(--sub); font-weight: 600; margin: 20px 4px 8px; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--text); background: var(--chip); border: 1px solid transparent;
  border-radius: 10px; padding: 8px 10px; width: 100%; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--brand); }
.card { background: var(--card); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); }
.muted { color: var(--sub); }
.row { display: flex; align-items: center; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.btn { background: var(--brand); color: #fff; border-radius: 12px; padding: 10px 16px; font-weight: 600; }
@media (prefers-color-scheme: dark) { .btn { color: #042f2e; } }
.btn.ghost { background: var(--chip); color: var(--text); }
.btn.danger { background: transparent; color: var(--red); }
.hidden { display: none !important; }

/* 总览 */
.summary { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; }
.summary .big { font-size: 24px; font-weight: 700; letter-spacing: -.5px; }
.summary .k { font-size: 12px; color: var(--sub); }
.summary .v { font-size: 16px; font-weight: 600; }

/* 输入区 */
.composer { margin-top: 12px; }
.composer textarea { min-height: 52px; resize: none; background: transparent; border: 0; padding: 4px 2px; font-size: 17px; }
.composer .tools { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.mic { width: 56px; height: 56px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; flex: none;
  box-shadow: 0 4px 14px rgba(15,118,110,.35); }
.mic svg { width: 26px; height: 26px; }
.mic.on { background: var(--red); animation: pulse 1.2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(220,38,38,.5);} 100% { box-shadow: 0 0 0 16px rgba(220,38,38,0);} }
.hint { font-size: 12px; color: var(--sub); }

/* 草稿 */
.draft { margin-top: 10px; border: 1.5px solid var(--brand-soft); }
.draft .amt { font-size: 22px; font-weight: 700; width: 100%; background: transparent; padding: 2px 0; border: 0; }
.draft .amt::placeholder { color: var(--red); font-weight: 500; font-size: 16px; }
.seg { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 2px; flex: none; }
.seg button { padding: 4px 10px; border-radius: 8px; font-size: 13px; color: var(--sub); }
.seg button.on { background: var(--card); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
.cats { display: flex; gap: 6px; margin: 10px -14px; padding: 0 14px; overflow-x: auto; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cat { padding: 5px 10px; border-radius: 999px; background: var(--chip); font-size: 13px; flex: none; }
.cat.on { background: var(--brand); color: #fff; }
@media (prefers-color-scheme: dark) { .cat.on { color: #042f2e; } }
.fields { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.fields select, .fields input { font-size: 13px; padding: 7px 8px; }
.draft .note { margin-top: 6px; font-size: 14px; }
.actions { display: flex; gap: 8px; margin-top: 10px; }
.actions .btn { flex: 1; }

/* 列表 */
.day { margin-top: 14px; }
.day-h { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); padding: 0 4px 6px; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.ico { width: 36px; height: 36px; border-radius: 10px; background: var(--chip); display: grid; place-items: center; font-size: 18px; flex: none; }
.item .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .s { font-size: 12px; color: var(--sub); }
.item .m { text-align: right; font-weight: 600; white-space: nowrap; }
.item .m small { display: block; font-weight: 400; font-size: 11px; color: var(--sub); }
.inc { color: var(--green); }

/* 统计 */
.month-nav { display: flex; align-items: center; justify-content: space-between; }
.month-nav button { padding: 6px 12px; font-size: 18px; }
.bar-row { display: grid; grid-template-columns: 76px 1fr auto; gap: 8px; align-items: center; padding: 6px 0; font-size: 14px; }
.bar { height: 10px; background: var(--chip); border-radius: 6px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--brand); border-radius: 6px; }
.daily { display: flex; align-items: flex-end; gap: 2px; height: 80px; margin-top: 8px; }
.daily i { flex: 1; background: var(--brand); opacity: .75; border-radius: 2px 2px 0 0; min-height: 1px; }
.daily i.zero { background: var(--line); }

/* 设置 */
.set-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.acc-row { display: grid; grid-template-columns: 1fr 80px 32px; gap: 6px; padding: 6px 0; }
.acc-row input.kw { grid-column: 1 / -1; font-size: 12px; }

/* 底部导航 */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
  display: flex; padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); z-index: 10; }
nav.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--sub); gap: 2px; }
nav.tabs button span { font-size: 20px; }
nav.tabs button.on { color: var(--brand); font-weight: 600; }

/* 弹层 / 提示 */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 90vh; overflow: auto; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #111827; color: #fff;
  padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 30; display: flex; gap: 14px; align-items: center; max-width: calc(100% - 32px); }
.toast button { color: #5eead4; font-weight: 600; white-space: nowrap; }
.toast span { white-space: nowrap; }
.empty { text-align: center; color: var(--sub); padding: 28px 0; font-size: 14px; }
.examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.examples button { font-size: 12px; background: var(--chip); border-radius: 999px; padding: 4px 10px; color: var(--sub); }
</style>
</head>
<body>
<main>
  <!-- 记账页 -->
  <section id="page-home">
    <div class="card summary" id="summary"></div>

    <div class="card composer">
      <textarea id="input" rows="2" placeholder="说一句话记账，比如：&#10;午饭麦当劳12块5 PayNow，打车8块"></textarea>
      <div class="tools">
        <button class="mic" id="mic" aria-label="语音输入">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>
        </button>
        <div class="grow hint" id="mic-hint">点麦克风说一句，自动识别金额、分类、付款方式和日期。一次说几笔也行。</div>
        <button class="btn ghost" id="manual">手动</button>
      </div>
      <div class="examples" id="examples"></div>
    </div>

    <div id="drafts"></div>

    <h2>最近</h2>
    <div class="card" id="recent"></div>
  </section>

  <!-- 统计页 -->
  <section id="page-stats" class="hidden">
    <div class="card month-nav">
      <button id="m-prev">‹</button><b id="m-label"></b><button id="m-next">›</button>
    </div>
    <div class="card summary" style="margin-top:10px" id="m-summary"></div>
    <h2>每日支出</h2>
    <div class="card"><div class="daily" id="m-daily"></div></div>
    <h2>支出分类</h2>
    <div class="card" id="m-cats"></div>
    <h2>付款方式</h2>
    <div class="card" id="m-accs"></div>
    <h2>本月明细</h2>
    <div class="card" id="m-list"></div>
  </section>

  <!-- 设置页 -->
  <section id="page-settings" class="hidden">
    <h2>统计用的主币种</h2>
    <div class="card">
      <div class="set-row"><span class="grow">主币种</span>
        <select id="s-base" style="width:auto"></select></div>
      <div class="set-row"><span class="grow">1 SGD = <input id="s-cny" type="number" step="0.0001" inputmode="decimal" style="width:90px;display:inline-block"> CNY</span>
        <button class="btn ghost" id="s-rate">联网更新汇率</button></div>
      <div class="hint" id="s-rate-info" style="margin-top:6px"></div>
    </div>

    <h2>付款方式（说到关键词就自动选中）</h2>
    <div class="card">
      <div id="s-accs"></div>
      <div class="row" style="margin-top:8px">
        <span class="grow hint">默认付款方式</span>
        <select id="s-default" style="width:auto"></select>
      </div>
      <button class="btn ghost" id="s-add-acc" style="margin-top:10px;width:100%">+ 添加付款方式</button>
    </div>

    <h2>我教过的分类（改一次分类就记住了）</h2>
    <div class="card" id="s-learned"></div>

    <h2>语音诊断（麦克风不好用时截图这里）</h2>
    <div class="card">
      <pre id="s-vlog" style="margin:0;font-size:12px;white-space:pre-wrap;max-height:220px;overflow:auto" class="muted"></pre>
      <button class="btn ghost" id="s-vlog-clear" style="margin-top:8px">清空记录</button>
    </div>

    <h2>数据</h2>
    <div class="card">
      <div class="hint" style="margin-bottom:10px">数据只存在这台设备的浏览器里。建议每月导出一次备份。</div>
      <div class="row" style="flex-wrap:wrap">
        <button class="btn ghost" id="s-export">导出备份 (JSON)</button>
        <button class="btn ghost" id="s-csv">导出表格 (CSV)</button>
        <button class="btn ghost" id="s-import">导入备份</button>
        <input type="file" id="s-file" accept=".json,application/json" class="hidden">
      </div>
      <div class="hint" id="s-count" style="margin-top:10px"></div>
    </div>
  </section>
</main>

<nav class="tabs">
  <button data-tab="home" class="on"><span>✏️</span>记账</button>
  <button data-tab="stats"><span>📊</span>统计</button>
  <button data-tab="settings"><span>⚙️</span>设置</button>
</nav>

<script src="parser.js"></script>
<script src="app.js"></script>
</body>
</html>
